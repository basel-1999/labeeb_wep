name: labeeb_wep
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core & Routing
  go_router: ^14.0.0
  http: ^1.2.0
  universal_html: ^2.2.4

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.0.0
  firebase_messaging: ^15.0.0
  firebase_storage: ^12.0.0

  # Agora (Voice & Video)
  agora_rtc_engine: ^6.3.0
  agora_token_generator: ^1.0.0

  # UI & Utilities
  flutter_drawing_board: ^0.9.3
  pdf: ^3.10.8
  printing: ^5.13.1
  file_picker: ^8.0.0
  audioplayers: ^6.0.0
  url_launcher: ^6.3.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - images/